services:
  php:
    extends:
      file: ../compose.yml
      service: php
    networks:
      - php

  postgres:
    extends:
      file: ../compose.yml
      service: postgres
    networks:
      - adminer
      - php

  adminer:
    image: adminer:5.4.0
    ports:
      - 8081:8080
    depends_on:
      - postgres
    networks:
      - adminer

volumes:
  database:

networks:
  adminer:
  php:
