services:
  mariadb:
    image: mariadb:12.0.2
    volumes:
      - database:/var/lib/mysql:Z
    environment:
      # - MARIADB_ROOT_PASSWORD=toto
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}

  phpmyadmin:
    image: phpmyadmin:5.2.2
    ports:
      - 8080:80
    environment:
      PMA_ARBITRARY: 1
    depends_on:
      - mariadb

  adminer:
    image: adminer:5.4.0
    ports:
      - 8081:8080
    depends_on:
      - mariadb

volumes:
  database:
